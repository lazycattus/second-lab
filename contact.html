<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Me</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="stylecontact.css">
</head>
<body>

  <!-- Navigation -->
   <nav class="navbar">
  <div class="nav-container">
     <div class="logo"><a href="index.html">ainarg</a></div>
    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="education.html">Education</a></li>
      <li><a href="socialactivity.html">Social Activity</a></li>
      <li><a href="project.html">Project</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </div>
</nav>

  <!-- Contact Header -->
  <header class="contact-header">
    <h2>💌 Get in Touch</h2>
    <p>“You’ve got a friend in me.” — Toy Story</p>
  </header>

  <!-- Contact Section -->
  <section class="contact-section">
    <div class="contact-wrapper">

      <!-- Contact Form -->
      <form class="contact-form">
        <label for="name">Your Name</label>
        <input type="text" id="name" placeholder="Enter your name" required>

        <label for="email">Your Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="message">Your Message</label>
        <textarea id="message" rows="5" placeholder="Type your message..."></textarea>

        <button type="submit">Send Message</button>
      </form>

      <!-- Pusheen Image -->
      <div class="contact-cat">
        <img src="pusheenfriends.gif" alt="Pusheen Group">
      </div>

    </div>
  </section>

  <!-- Pusheen Parade -->
  <div class="pusheen-parade">
    <img src="sleeping pusheen.gif" alt="Pusheen">
    <img src="sleeping pusheen.gif" alt="Pusheen">
    <img src="sleeping pusheen.gif" alt="Pusheen">
    <img src="sleeping pusheen.gif" alt="Pusheen">
    <img src="sleeping pusheen.gif" alt="Pusheen">
  </div>

</body>
</html>
